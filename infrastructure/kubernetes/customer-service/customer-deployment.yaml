apiVersion: apps/v1
kind: Deployment

metadata:
  name: customer-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: customer-service

  template:
    metadata:
      labels:
        app: customer-service

    spec:
      containers:
      - name: customer-service
        image: customer-service:v2
        imagePullPolicy: Never

        ports:
        - containerPort: 8080

        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://host.minikube.internal:5432/customerdb"

        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"

        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"