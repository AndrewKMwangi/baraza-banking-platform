apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-ingress
  namespace: baraza-banking
spec:
  ingressClassName: nginx
  rules:
  - host: customer.baraza.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: customer-service
            port:
              number: 8080