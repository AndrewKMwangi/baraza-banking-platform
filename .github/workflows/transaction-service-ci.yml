name: Transaction Service CI

on:
  push:
    paths:
      - "applications/transaction-service/**"
      - ".github/workflows/transaction-service-ci.yml"
  pull_request:
    paths:
      - "applications/transaction-service/**"
      - ".github/workflows/transaction-service-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/transaction-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Inspect Maven wrapper
        run: |
          ls -l mvnw
          file mvnw
          head -n 1 mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Package application
        run: ./mvnw package

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./applications/transaction-service
          push: true
          tags: ghcr.io/andrewkmwangi/transaction-service:${{ github.sha }}
