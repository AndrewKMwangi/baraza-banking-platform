
name: Customer Service CI

on:
  push:
    paths:
      - "applications/customer-service/**"
      - ".github/workflows/customer-service-ci.yml"

  pull_request:
    paths:
      - "applications/customer-service/**"
      - ".github/workflows/customer-service-ci.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  pipeline:
    name: Customer Service DevSecOps Pipeline
    uses: AndrewKMwangi/devsecops-pipeline-templates/.github/workflows/pipeline-orchestrator.yml@feature/pipeline-architecture

    with:
      app-stack: java
      working-directory: applications/customer-service
      java-version: "21"

      image-name: customer-service
      dockerfile: Dockerfile
      build-context: applications/customer-service
      image-tag: ${{ github.sha }}

      gitops-owner: AndrewKMwangi
      gitops-repository: baraza-banking-gitops
      target-branch: main
      chart-directory: customer-service/chart
      values-file: customer-service/chart/values-gitops-dev.yaml

      signing-identity: https://github.com/AndrewKMwangi/devsecops-pipeline-templates/.github/workflows/image-signing.yml@refs/heads/feature/pipeline-architecture

    secrets:
      gitops-app-client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
      gitops-app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
