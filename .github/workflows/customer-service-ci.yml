name: Customer Service CI

on:
  push:
    paths:
      - "applications/customer-service/**"
      - ".github/workflows/customer-service-ci.yml"
  pull_request:
    paths:
      - "applications/customer-service/**"
      - ".github/workflows/customer-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/customer-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Inspect Maven wrapper
        run: |
          ls -l mvnw
          file mvnw
          head -n 1 mvnw

      - name: Run tests
        run: ./mvnw test
